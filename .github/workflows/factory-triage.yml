name: Factory Triage

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Guarded triage status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Factory target: Level 3 -> Level 4"
          echo "Auto-merge and production deploy are intentionally disabled."
          echo "Open PRs:"
          gh pr list --state open --limit 20 || true
          echo "Open issues:"
          gh issue list --state open --limit 20 || true
